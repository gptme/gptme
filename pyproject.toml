[project]
name = "gptme"
version = "0.35.1"
description = "Powerful AI agent for coding and general tasks. Terminal-first with shell, code execution, file editing, web browsing, vision, computer use. Unconstrained."
authors = [
    { name = "Erik Bjäreholt", email = "erik@bjareho.lt" },
]
readme = "README.md"
license = "MIT"
keywords = [
    "ai", "llm", "gpt", "claude", "agent", "autonomous-agent",
    "terminal", "cli", "shell", "coding-assistant", "computer-use",
    "automation", "tool-use", "code-generation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.11,<3.16"
dependencies = [
    "click>=8.4,<9",
    "click-default-group>=1.2.4,<2",
    "python-dotenv>=1.2.2,<2",
    "rich>=15.0,<16",
    "tabulate",
    "pick>=2.6.0,<3; sys_platform != 'win32'",
    "tiktoken>=0.13.0",
    "tomlkit",
    "typing-extensions",
    "platformdirs>=4.11,<5",
    "requests>=2.34,<3",  # For HTTP requests in browser tool (PDF detection)
    "json-repair>=0.61.7,<0.62",
    "mcp>=1.28.1,<2",
    "questionary>=2.1.1,<3",
    "python-dateutil>=2.9.0.post0,<3",
    "pyyaml>=6.0.3,<7",

    # providers
    "openai>=2.48,<3",
    "anthropic>=1.8,<2",
    "httpx2>=2.0.0,<3",  # Anthropic transport exceptions are imported directly.

    # tools
    "ipython>=8.39.0,<9",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-bash>=0.25.1,<0.26",

    # evals
    "multiprocessing-logging>=0.3.4,<0.4",

    # datascience essentials
    "pillow",  # non-optional, needed for image scaling in vision

    # server (also imported at module scope by the Anthropic provider)
    "pydantic>=2.13.4,<3",
]

[project.optional-dependencies]
server = [
    "flask>=3.0,<4",
    "flask-cors>=6.0.5,<7",
    "flask-compress>=1.14",
    "pydantic>=2.13.4,<3",
    "prometheus-client>=0.26.0",
]
browser = [
    "playwright==1.61.0",  # version constrained due to annoying to have to run `playwright install` on every update
]
docs = [  # enhanced HTML/XML parsing + PDF extraction; not required for basic use
    "lxml",  # HTML/XML parsing; optional — falls back to stdlib xml.etree.ElementTree
    "pypdf>=6.21.1",  # PDF extraction in browser tool (CVE fix: RAM exhaustion + infinite loop; >=6.21.1 for GHSA-5hx5-vpf9-5wcv)
]
minimal = []  # no native extensions beyond pydantic-core; works on ARM/musl/Termux/Lambda
datascience = ["matplotlib", "pandas", "numpy"]  # pillow (non-opt)
sandbox = [
    "wasmtime>=47.0.1",  # Wasmtime WASI Python sandbox (GPTME_SANDBOX=wasmtime)
]
kernel = [
    "jupyter_client>=8.0,<9",  # Jupyter kernel protocol (GPTME_IPYTHON_BACKEND=kernel)
    "ipykernel>=6.0,<7",       # IPython kernel for out-of-process execution
]
sounds = ["sounddevice", "scipy"]
computer = []  # pillow (non-opt); AT-SPI2 accessibility needs system pkg: apt install python3-pyatspi
pyinstaller = [
    "pyinstaller>=6.21,<7; python_version >= '3.10' and python_version < '3.15'",  # not yet compatible with Python 3.15+
]
acp = [
    "agent-client-protocol>=0.11.0; python_version >= '3.10' and python_version < '3.15'",
]
tui = ["textual>=8,<9"]
telemetry = [
    "opentelemetry-api>=1.45.1,<2",
    "opentelemetry-sdk>=1.45.1,<2",
    "opentelemetry-exporter-otlp>=1.45.1,<2",
    "opentelemetry-exporter-prometheus>=0.66b1,<0.67",
    "opentelemetry-instrumentation-flask>=0.66b1,<0.67",
    "opentelemetry-instrumentation-requests>=0.66b1,<0.67",
    "opentelemetry-instrumentation-anthropic>=0.62.4,<0.63",
    "opentelemetry-instrumentation-openai>=0.62.4,<0.63",
    "opentelemetry-instrumentation-threading>=0.66b1,<0.67",
]
dspy = [
    "dspy>=3.2.1,<4; python_full_version <= '3.13.0'",
    "sentence-transformers>=5.6.1,<6; python_version < '3.15'",
]
swebench = [  # narrow install for the SWE-bench public benchmark lane
    "datasets>=5.0.0",  # for SWE-bench eval
    "swebench>=1.0",  # for SWE-bench eval harness
]
eval = [
    "dspy>=3.2.1,<4; python_full_version <= '3.13.0'",
    "sentence-transformers>=5.6.1,<6; python_version < '3.15'",
    "datasets>=5.0.0",
    "swebench>=1.0",
    "terminal-bench>=0.1; python_version >= '3.12' and python_version < '3.15'",
]
all = [
    "flask>=3.0,<4",
    "flask-cors>=6.0.5,<7",
    "flask-compress>=1.14",
    "pydantic>=2.13.4,<3",
    "agent-client-protocol>=0.11.0; python_version >= '3.10' and python_version < '3.15'",
    "textual>=8,<9",
    "playwright==1.61.0",
    "lxml",
    "pypdf>=6.21.1",
    "matplotlib",
    "pandas",
    "numpy",
    "sounddevice",
    "scipy",
    "dspy>=3.2.1,<4; python_full_version <= '3.13.0'",
    "sentence-transformers>=5.6.1,<6; python_version < '3.15'",
    "opentelemetry-api>=1.45.1,<2",
    "opentelemetry-sdk>=1.45.1,<2",
    "opentelemetry-exporter-otlp>=1.45.1,<2",
    "opentelemetry-exporter-prometheus>=0.66b1,<0.67",
    "opentelemetry-instrumentation-flask>=0.66b1,<0.67",
    "opentelemetry-instrumentation-requests>=0.66b1,<0.67",
    "opentelemetry-instrumentation-anthropic>=0.62.4,<0.63",
    "opentelemetry-instrumentation-openai>=0.62.4,<0.63",
    "opentelemetry-instrumentation-threading>=0.66b1,<0.67",
]

[project.urls]
Homepage = "https://gptme.org/"
Repository = "https://github.com/gptme/gptme"
Documentation = "https://gptme.org/docs/"
Issues = "https://github.com/gptme/gptme/issues"

[project.entry-points."gptme.plugins"]
auto_snapshots = "gptme.hooks.auto_snapshots:plugin"
aw_watcher_agent = "gptme.hooks.aw_watcher_agent:plugin"

[project.scripts]
gptme = "gptme.cli.main:main"
gptme-tui = "gptme.tui.main:main"
gptme-server = "gptme.server.cli:main"
gptme-acp = "gptme.acp.__main__:main"
gptme-eval = "gptme.eval.main:main"
gptme-eval-swebench = "gptme.eval.swebench.main:main"
gptme-eval-tbench = "gptme.eval.tbench.run:main"
gptme-util = "gptme.cli.util:main"
gptme-attest = "gptme.cli.cmd_attest:main"
gptme-agent = "gptme.agent.cli:main"
gptme-doctor = "gptme.cli.doctor:main"
gptme-auth = "gptme.cli.auth:main"
gptme-onboard = "gptme.cli.onboard:main"
gptme-wut = "gptme.cli.wut:main"
gptme-checkpoint = "gptme.cli.checkpoint:main"
gptme-init = "gptme.cli.cmd_init:main"
gptme-tutorial = "gptme.cli.cmd_tutorial:main"
gptme-dspy = "gptme.eval.dspy:main"
gptme-eval-trends = "gptme.eval.trends:main"
gptme-convert = "gptme.tools.convert:main"
gptme-status = "gptme.cli.cmd_status:status"
gptme-resume = "gptme.cli.cmd_resume:resume"
gptme-mcp-server = "gptme.cli.cmd_mcp_serve:main"
gptme-stats = "gptme.cli.cmd_stats:stats"
gptme-service = "gptme.cli.cmd_service:cli"
gptme-dataset = "gptme.cli.cmd_dataset:dataset"

[tool.poetry]
packages = [
    { include = "gptme" },
]
# Keep entries as tables: Dependabot corrupts mixed string/table arrays.
include = [
    { path = "gptme/server/computer_view/**/*" },
    { path = "gptme/util/export_templates/**/*" },
    # webui-dist is generated and gitignored; an explicit path include is
    # required so Poetry does not silently omit it from release artifacts.
    { path = "gptme/server/webui-dist", format = ["sdist", "wheel"] },
    { path = "gptme/data/faq.yaml", format = ["sdist", "wheel"] },
    { path = "gptme/eval/tbench/setup.sh" },
    # Poetry include without `format` is sdist-only. Wheels must list both.
    # #969 added media/*.wav without format, so pip/uv installs shipped no
    # sounds (`gptme-util sound list` empty; #964 recurred on the wheel).
    { path = "media/*.png", format = ["sdist", "wheel"] },
    { path = "media/*.svg", format = ["sdist", "wheel"] },
    { path = "media/*.wav", format = ["sdist", "wheel"] },
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-timeout>=2.4,<3",
    "pytest-retry>=1.7,<2",
    "pytest-dotenv>=0.5.2,<0.6",
    "pytest-cov",
    "pytest-xdist>=3.8,<4",
    "hypothesis>=6.100,<7",
    "pytest-profiling>=1.7,<2",
    "greenlet",  # needed for playwright coverage
    "mypy",
    "ruff",
    "pylint",
    "pre-commit",
    "radon",
    "openapi-spec-validator>=0.9,<0.10",
    "jsonschema>=4.26,<5",  # Draft-07 contract tests; not a runtime dependency
    "pyinstaller>=6.21,<7; python_version >= '3.10' and python_version < '3.15'",
    "sphinx>=8,<9",
    "sphinx-click>=6.2,<7",
    "sphinx-book-theme>=1.1.4,<2",
    "sphinx-sitemap>=2.9,<3",
    "sphinx-autobuild>=2024.10.3,<2025",
    "sphinx-llms-txt>=0.7.1,<0.8",
    "sphinxcontrib-programoutput",
    "sphinxcontrib-asciinema",
    "sphinxcontrib-mermaid>=2.1,<3",
    "myst-parser",
    "types-tabulate",
    "types-lxml",
    "lxml",
    "pypdf",
    "tomli>=2.4.1,<3",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "E4", "E7", "E9",  # pycodestyle
    "F",      # pyflakes
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "I",      # isort
    "C4",     # flake8-comprehensions
    "FURB",   # refurb
    "FLY",    # flynt (f-string over join)
    "ISC",    # implicit-str-concat
    "PLE",    # pylint errors
    "PERF",   # perflint
    "RSE102", # unnecessary-paren-on-raise-exception
    "SIM103", "SIM110", "SIM117", "SIM118", "SIM300", "SIM910",  # flake8-simplify
    "PIE790", "PIE810",  # flake8-pie
    "RET501", "RET505", "RET506", "RET507", "RET508",  # flake8-return
    "RUF010", "RUF019", "RUF100",  # ruff-specific
    "PLW1510",  # subprocess-run-without-check
    "TC001", "TC002", "TC003", "TC004",  # flake8-type-checking
    "PT003", "PT006", "PT011", "PT022",  # pytest style
    "DTZ",    # flake8-datetimez (require timezone-aware datetimes)
]
ignore = ["E402", "E501", "B905", "PERF203"]  # PERF203: try-except-in-loop often intentional
#fixable = ["ALL"]
#unfixable = ["B"]

[tool.uv]
# Force filelock>=4.2.1 across all Python versions (3.11+). The 3.x series
# has three unfixed advisories (GHSA-v4x8-3wr5-3wq8, GHSA-9vhv-jxww-xfm5,
# GHSA-567q-5qvw-pf92) for ReadWriteLock/Windows usage. filelock 4.x fixes
# them and requires Python>=3.11, matching our own floor.
constraint-dependencies = ["filelock>=4.2.1"]

