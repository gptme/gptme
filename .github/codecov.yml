# TODO: set up flags, but would require splitting the `make test` command for each flag, or set the flag for each provider/model
# https://docs.codecov.com/docs/flags

# https://docs.codecov.com/docs/components
component_management:
  individual_components:
    - component_id: module_core  # this is an identifier that should not be changed
      name: core  # this is a display name, and can be changed freely
      paths:
        - gptme/*
    - component_id: module_tools
      name: tools
      paths:
        - gptme/tools/**
    - component_id: module_server
      name: server
      paths:
        - gptme/server/**
    - component_id: module_eval
      name: eval
      paths:
        - gptme/eval/**

# Codecov merges every upload into one line report, including mypy's
# type-precision report (lint.yml, flag `type-coverage`). Left alone, that
# report decides the pass/fail statuses: it covers tests/ and scripts/, so
# test-only PRs fail patch coverage on "missed" (imprecisely typed) test
# lines, and type-precise lines in gptme/ count as covered even if no test
# runs them. Gate on test coverage only; keep type coverage as its own,
# informational status.
coverage:
  status:
    project:
      default:
        flags: [code]
      type-coverage:
        flags: [type-coverage]
        informational: true
    patch:
      default:
        flags: [code]

# Only mypy's report includes these (tests run with --cov=gptme).
ignore:
  - "tests/**"
  - "scripts/**"
