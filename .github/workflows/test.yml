name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    # Stacked PRs target feature branches before their base lands on master.
    branches: [ master, 'feat/*' ]
    # ready_for_review is not in the default pull_request types. Heavy jobs
    # skip drafts (review rounds cost no runner slots on the 20-job org
    # pool); this type retriggers Test when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge queue: the queue waits for required checks on its temporary merge
  # commit, so the required jobs below must run for merge_group events.
  merge_group:

# Cancel a PR's older runs when it gets a new push (they're superseded).
# Every other run (master push, release, dispatch, schedule) gets its own
# group, so none of them can cancel or replace another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

jobs:
  # Detect which paths changed to skip expensive jobs on config-only PRs
  # (docs-only PRs still run the no-API tests; API tests stay code-gated)
  changes:
    # Unique name: tauri.yml also has a "Detect changes" job, and this one is a
    # required check for the merge queue (a failed changes job would otherwise
    # skip the test jobs, and skipped satisfies a required check).
    name: Test / detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: read
    outputs:
      # Core Python code changed (any gptme source, tests, deps, or docs read by tests)
      code: ${{ steps.filter.outputs.code }}
      # LLM/API-related code changed (llm, acp, tools, agent, tests)
      api-related: ${{ steps.filter.outputs.api-related }}
      # Dependency or interpreter setup changed (gates the Python 3.15 job on PRs)
      deps: ${{ steps.filter.outputs.deps }}
    steps:
    - uses: actions/checkout@v7
      if: github.event_name != 'merge_group'
    - uses: dorny/paths-filter@v4
      id: filter
      # merge_group runs the core suites unconditionally (see job conditions).
      if: github.event_name != 'merge_group'
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        filters: |
          code:
            - 'gptme/**'
            - 'tests/**'
            - 'uv.lock'
            - 'pyproject.toml'
            - 'Makefile'
            - '.github/workflows/test.yml'
            # Tests read real repo docs (docs/lessons/, tool-formats.rst,
            # hooks.rst, plugins.rst, models/providers pages, README.md), so a
            # docs-only change can break them (gptme/gptme#4997 did).
            - 'docs/**'
            - 'README.md'
          api-related:
            - 'gptme/llm/**'
            - 'gptme/acp/**'
            - 'gptme/tools/**'
            - 'gptme/agent/**'
            - 'gptme/eval/**'
            - 'gptme/chat.py'
            - 'gptme/codeblock.py'
            - 'gptme/message.py'
            - 'gptme/prompts.py'
            - 'gptme/session.py'
            - 'gptme/executor.py'
            - 'tests/**'
            - 'uv.lock'
            - 'Makefile'
            - '.github/workflows/test.yml'
          deps:
            - 'uv.lock'
            - 'pyproject.toml'
            - 'Makefile'
            - '.github/workflows/test.yml'

  # Core tests: no API keys needed, runs all tests except requires_api/eval
  # Also includes slow tests (browser, MCP, integration, etc.) since they don't need API
  test-no-api:
    needs: changes
    # Always run on push/merge_group; on PRs, only when code changed.
    # Skip draft PRs so review-round pushes do not occupy the 20-job org pool.
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name == 'push' || github.event_name == 'merge_group' || needs.changes.outputs.code == 'true')
    name: Test without API keys
    runs-on: ubuntu-latest
    # A hung xdist worker otherwise burns the 6h default (gptme/gptme#4009:
    # TestTmuxRealTerminal::test_confirm_dialog_keys_work ran until cancel).
    timeout-minutes: 45
    env:
      RELEASE: false
      # Explicitly unset API keys to test without them
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      DEEPSEEK_API_KEY: ''
      OPENROUTER_API_KEY: ''
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    - name: Install apt dependencies
      run: |
        # Unused here, and its intermittent 403s fail `apt-get update`.
        grep -rlF packages.microsoft.com /etc/apt/sources.list.d/ | xargs -r sudo rm -f
        sudo apt-get update && sudo apt-get install -y universal-ctags pandoc tmux x11-xserver-utils xvfb xdotool scrot xterm fluxbox imagemagick

    - name: Set up Xvfb
      run: |
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        echo "DISPLAY=:99" >> $GITHUB_ENV

    - uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: uv sync --all-extras --frozen

    - name: Install prek for real-runner regressions
      run: uv tool install prek==0.3.3

    - name: Install playwright
      run: uv run playwright install chromium

    # Slow tests (browser, MCP, integration) run on master and dispatch only:
    # they dominate this job's runtime, and PR CI waits on it.
    - name: Run tests (without API keys; slow tests on master only)
      env:
        TERM: xterm
        MODEL: local/test
        # Neither runner's integration cases may silently skip in this job.
        GPTME_TEST_REQUIRE_PRECOMMIT_RUNNERS: '1'
      run: make test ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && 'SLOW=true' || '' }}

    - name: Run performance tests serially
      env:
        TERM: xterm
        MODEL: local/test
      run: make test-perf ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && 'SLOW=true' || '' }}

    - name: Upload visual snapshot diffs on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: tui-visual-snapshot-diffs
        path: tests/snapshots/*.actual.svg
        if-no-files-found: ignore

    - name: Upload coverage reports to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: no-api

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        report_type: test_results
        files: junit.xml,junit-perf.xml

  # Minimal install test: no extras, tests the most common user installation config
  test-minimal:
    needs: changes
    # Always run on push/merge_group; on PRs, only when code changed.
    # Skip draft PRs so review-round pushes do not occupy the 20-job org pool.
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name == 'push' || github.event_name == 'merge_group' || needs.changes.outputs.code == 'true')
    name: Test without API keys or extras
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE: false
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      DEEPSEEK_API_KEY: ''
      OPENROUTER_API_KEY: ''
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    - name: Install apt dependencies
      run: |
        # Unused here, and its intermittent 403s fail `apt-get update`.
        grep -rlF packages.microsoft.com /etc/apt/sources.list.d/ | xargs -r sudo rm -f
        sudo apt-get update && sudo apt-get install -y universal-ctags pandoc tmux x11-xserver-utils xvfb

    - name: Set up Xvfb
      run: |
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        echo "DISPLAY=:99" >> $GITHUB_ENV

    - uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.11'

    - name: Install dependencies (no extras)
      run: uv sync --frozen

    # Python 3.11 spins under coverage after SetAsyncExc(..., NULL), even
    # when clearing an empty slot. Keep every behavior test; collect coverage
    # in the Python 3.12 full-install job instead.
    - name: Run tests (no extras, fast only)
      env:
        TERM: xterm
        MODEL: local/test
      run: make test NO_COVERAGE=1

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        report_type: test_results

  # Newest supported Python: the minimal install on 3.15, without coverage uploads.
  # Runs on every master push. On PRs it runs only when dependencies or the
  # interpreter setup change: for a code-only PR it repeats test-minimal's
  # suite (3.11) at ~18 runner-minutes, the second-largest job in this workflow.
  # A 3.15-only regression from a code PR surfaces on the master push instead.
  test-py315:
    needs: changes
    # Skip draft PRs so review-round pushes do not occupy the 20-job org pool.
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name == 'push' || needs.changes.outputs.deps == 'true')
    name: Test on Python 3.15 without API keys or extras
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE: false
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      DEEPSEEK_API_KEY: ''
      OPENROUTER_API_KEY: ''
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    - name: Install apt dependencies
      run: |
        # Unused here, and its intermittent 403s fail `apt-get update`.
        grep -rlF packages.microsoft.com /etc/apt/sources.list.d/ | xargs -r sudo rm -f
        sudo apt-get update && sudo apt-get install -y universal-ctags pandoc tmux x11-xserver-utils xvfb

    - name: Set up Xvfb
      run: |
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        echo "DISPLAY=:99" >> $GITHUB_ENV

    - uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.15'

    - name: Install dependencies (no extras)
      run: uv sync --frozen

    - name: Run tests (no extras, fast only)
      env:
        TERM: xterm
        MODEL: local/test
      run: make test

  # Windows smoke tests: a narrow, no-API slice covering the areas that actually
  # bit users (filesystem paths, config loading, CLI entrypoints). Deliberately
  # not a full matrix — a broad skip-marked suite would only buy fake confidence.
  test-windows:
    needs: changes
    # Always run on push to master; on PRs, only when code changed.
    # Skip draft PRs so review-round pushes do not occupy the 20-job org pool.
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name == 'push' || github.event_name == 'merge_group' || needs.changes.outputs.code == 'true')
    name: Test Windows path/config slice
    runs-on: windows-latest
    # The path-walk bug this job exists to catch manifests as an infinite loop,
    # so cap the job rather than burning the 6h default on a hang.
    timeout-minutes: 15
    env:
      RELEASE: false
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      DEEPSEEK_API_KEY: ''
      OPENROUTER_API_KEY: ''
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run Windows path/config smoke tests
      env:
        TERM: xterm
        MODEL: local/test
      run: |
        uv run pytest -v `
          tests/test_dirs.py `
          tests/test_logmanager_locking.py `
          tests/test_file_publication.py `
          tests/test_tools_patch.py::test_execute_patch `
          tests/test_tools_patch.py::test_execute_patch_size_warning `
          tests/test_config.py::test_custom_tool_file_allowlist_preserved `
          tests/test_config.py::test_custom_tool_file_mixed_allowlist `
          tests/test_config_validate.py::test_repair_writes_validated_newlines `
          tests/test_llm_openai.py::TestIsProxy `
          tests/test_cli.py::test_help `
          tests/test_cli.py::test_version

  # Quick lockfile health check: verifies that [dependency-groups] resolves
  # and the installed env satisfies the two most basic CLI smoke tests.
  # Invoke pytest through the venv interpreter (`python -m pytest`) so a
  # runner-PATH pytest cannot mask a broken project env.
  test-uv:
    needs: changes
    # Skip draft PRs so review-round pushes do not occupy the 20-job org pool.
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name == 'push' || github.event_name == 'merge_group' || needs.changes.outputs.code == 'true')
    name: Test with uv (lockfile smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE: false
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      DEEPSEEK_API_KEY: ''
      OPENROUTER_API_KEY: ''
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.12'

    - name: Install project + dev group (frozen)
      run: uv sync --frozen

    - name: Smoke uv-native pytest
      env:
        TERM: xterm
        MODEL: local/test
      run: |
        uv run python -m pytest -q \
          tests/test_cli.py::test_help \
          tests/test_cli.py::test_version

  # API tests: only run requires_api tests, across multiple cheap models
  # Skipped on docs/config-only PRs to reduce API spend (~$30+/day in Haiku costs)
  # Note: Anthropic tests route through OpenRouter (OPENROUTER_API_KEY) for cost controls
  test-api:
    needs: changes
    # Run on push to master, or on ready (non-draft) PRs when API-related code
    # changed (and not a fork). Drafts skip so review rounds cost no API or runners.
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (
        (github.event_name == 'push') ||
        (needs.changes.outputs.api-related == 'true' &&
         (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'))
      )
    name: API tests with ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE: false
      # OpenRouter can treat omitted max_tokens as the model's full output ceiling,
      # which is wasteful and can exceed the CI account's credit budget.
      GPTME_MAX_TOKENS: "8192"
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: 'openai/gpt-4o-mini'
          - model: 'openrouter/anthropic/claude-haiku-4-5'
          # - model: 'openrouter/minimax/minimax-m2.5'  # disabled: too brittle (SSL errors, inconsistent stop reasons)
          #   experimental: true

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    - name: Install apt dependencies
      run: |
        # Unused here, and its intermittent 403s fail `apt-get update`.
        grep -rlF packages.microsoft.com /etc/apt/sources.list.d/ | xargs -r sudo rm -f
        sudo apt-get update && sudo apt-get install -y universal-ctags pandoc tmux x11-xserver-utils xvfb

    - name: Set up Xvfb
      run: |
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        echo "DISPLAY=:99" >> $GITHUB_ENV

    - uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: uv sync --all-extras --frozen

    - name: Install playwright
      run: uv run playwright install chromium

    - name: Run API tests only
      uses: nick-fields/retry@v4
      env:
        TERM: xterm
        MODEL: ${{ matrix.model }}
      with:
        timeout_minutes: 15
        max_attempts: 1  # favor pytest retries (mark with flaky)
        retry_wait_seconds: 10
        command: make test-api

    - name: Upload coverage reports to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@v7
      env:
        MODEL: ${{ matrix.model }}
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        env_vars: MODEL
        flags: ${{ matrix.model }}

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        report_type: test_results
