name: Lint

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Cancel a PR's older runs when it gets a new push (they're superseded).
# Every other run (master push, release, dispatch, schedule) gets its own
# group, so none of them can cancel or replace another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Hook-install/config failures were silent when CI only ran `make lint`
  # (gptme/gptme-contrib#1481). Run the configured .pre-commit-config.yaml
  # hooks so that class of breakage cannot stay green.
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - name: Install poetry
      run: pipx install poetry
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - name: Install pre-commit
      run: pipx install pre-commit
    - name: Cache pre-commit environments
      uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Run pre-commit hooks
      env:
        # The pre-commit mypy mirror fails on gptme/__init__.pyi vs
        # gptme/__init__.py ("duplicate module named gptme"). The typecheck
        # job already runs mypy via mypy.ini; skip the broken mirror here.
        SKIP: mypy
      run: pre-commit run --all-files

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - name: Install poetry
      run: pipx install poetry
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: 'poetry'
    - name: Install dependencies
      run: |
        make build
        poetry install -E server -E browser -E telemetry -E dspy -E tui
        poetry run pip install tomli tomli_w lxml
    # The OpenAPI check needs the same install (server extra), so it runs here,
    # in parallel with mypy, instead of in its own job.
    - name: Typecheck and check OpenAPI spec
      run: |
        make check-openapi > openapi.log 2>&1 &
        openapi_pid=$!
        status=0
        make typecheck-coverage || status=$?
        openapi_status=0
        wait "$openapi_pid" || openapi_status=$?
        echo "::group::OpenAPI check"
        cat openapi.log
        echo "::endgroup::"
        if [ "$openapi_status" -ne 0 ]; then
          echo "::error::OpenAPI spec check failed (see the OpenAPI check group above)"
          status=1
        fi
        exit $status

    - name: Upload type coverage to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: type-coverage
        files: .mypy_coverage_report/cobertura.xml
