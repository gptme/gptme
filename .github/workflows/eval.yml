name: Evals

on:
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      suite:
        description: 'Eval suite to run (leave empty for basic suite)'
        required: false
      models:
        description: 'Comma-separated list of models to evaluate'
        required: false
      timeout:
        description: 'Timeout for each eval in seconds'
        type: number
        required: false
      image-suffix:
        type: choice
        description: 'Suffix to use for docker image'
        options:
        - ''
        - '-full'

jobs:
  run-evals:
    runs-on: ubuntu-latest
    # Scheduled basic suite is ~2m. workflow_dispatch accepts an arbitrary
    # suite × models × per-eval timeout; 60m cancelled those runs before
    # results were committed. Step timeout on "Run evals" leaves headroom
    # for the commit/push steps below.
    timeout-minutes: 180
    permissions:
      contents: write
      packages: read
    env:
      OWNER: ${{ github.repository_owner }}
      SUITE: ${{ github.event.inputs.suite || '' }}
      MODELS: ${{ github.event.inputs.models || '' }}
      TIMEOUT: ${{ github.event.inputs.timeout || '60' }}
      IMAGE_SUFFIX: ${{ github.event.inputs.image-suffix || '' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: eval-results
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set environment variables
      run: echo "OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >>${GITHUB_ENV}

    - name: Pull Docker image
      run: |
        docker pull ghcr.io/${OWNER_LC}/gptme-eval${IMAGE_SUFFIX}:latest

    - name: Write gptme config.toml
      shell: bash
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        mkdir -p ~/.config/gptme
        cat > ~/.config/gptme/config.toml << EOF
        [prompt]
        about_user = "I am a curious human programmer."
        response_preference = "Don't explain basic concepts"

        [env]
        OPENAI_API_KEY = "$OPENAI_API_KEY"
        ANTHROPIC_API_KEY = "$ANTHROPIC_API_KEY"
        OPENROUTER_API_KEY = "$OPENROUTER_API_KEY"
        GROQ_API_KEY = "$GROQ_API_KEY"
        EOF
        cat ~/.config/gptme/config.toml
        chmod -R o=rwx ~/.config/gptme

    - name: Run evals
      id: run-evals
      timeout-minutes: 165
      run: |
        MODEL_ARGS=""
        if [ -n "$MODELS" ]; then
          IFS=',' read -ra MODEL_ARRAY <<< "$MODELS"
          for MODEL in "${MODEL_ARRAY[@]}"; do
            MODEL_ARGS="$MODEL_ARGS -m $MODEL"
          done
        fi

        echo "Running evals for suite: ${SUITE:-basic}"
        echo "Models: ${MODELS:-default}"
        echo "Timeout: ${TIMEOUT} seconds"
        echo "Image suffix: ${IMAGE_SUFFIX}"

        RESULTS_DIR=$(pwd)/eval_results
        echo "Results dir: $RESULTS_DIR"
        mkdir -p $RESULTS_DIR
        chmod -R o=rwx $RESULTS_DIR  # make sure docker can read/write the dir

        IMAGE="ghcr.io/${OWNER_LC}/gptme-eval${IMAGE_SUFFIX}:latest"
        cleanup() {
          docker ps -aq --filter "ancestor=$IMAGE" | xargs -r docker rm -f
        }
        trap cleanup EXIT INT TERM

        docker run --rm \
          -v ~/.config/gptme:/home/appuser/.config/gptme \
          -v $RESULTS_DIR:/app/eval_results \
          "$IMAGE" \
          ${SUITE:+"$SUITE"} \
          --timeout "$TIMEOUT" \
          $MODEL_ARGS

    # Step timeout kills `docker run` but can leave the container writing to
    # the mounted eval_results dir. Stop leftovers even on failure; do not
    # git-add until we know the run finished (see Update eval results).
    - name: Stop leftover eval containers
      if: always() && steps.run-evals.outcome != 'skipped'
      run: |
        docker ps -aq --filter "ancestor=ghcr.io/${OWNER_LC}/gptme-eval${IMAGE_SUFFIX}:latest" | xargs -r docker rm -f

    - name: Configure Git
      if: steps.run-evals.outcome == 'success'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    # write_results() runs once at the end of the eval process and flushes
    # eval_results.csv row-by-row. A 165m step timeout can kill that write,
    # leaving a truncated CSV. Leaderboard/trend readers treat whatever
    # rows parsed as a recorded run (min_tests=4), so an incomplete file
    # is worse than no commit. The 180m job / 165m step split already
    # leaves 15m to commit after a *successful* run — that is the original
    # "long evaluations lose results" fix. always() was the wrong extra.
    - name: Update eval results
      if: steps.run-evals.outcome == 'success'
      run: |
        git pull origin eval-results
        git add -f eval_results
        git commit -m "chore: add eval results for run ${{ github.run_number }} [skip ci]" || echo "No changes to commit"
        git push origin eval-results
