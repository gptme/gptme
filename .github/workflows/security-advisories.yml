name: Security Advisories

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # advisories depend on dependencies (the weekly schedule catches new ones)
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'webui/package.json'
      - 'webui/package-lock.json'
      - '.github/workflows/security-advisories.yml'
  schedule:
    - cron: '0 8 * * 1'  # Weekly, Monday 8am UTC
  workflow_dispatch:

# Cancel a PR's older runs when it gets a new push (they're superseded).
# Master pushes share one group without cancel-in-progress: a running master
# run finishes, but a queued one is replaced by the newer push, so a burst of
# merges runs once on the latest commit instead of once per commit. Test keeps
# one group per master commit (its slow suite attributes regressions); every
# other run (release, dispatch, schedule) gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write  # Required for SARIF upload to GitHub Security tab

jobs:
  dependency-audit:
    name: Dependency Advisory Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Phase 2: advisory findings (audit exit 1) fail the job on push/PR via the final
    # step; tooling errors (exit >= 2) stay non-blocking.
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras --frozen || echo "::warning::Failed to resolve dependencies; audit will run against any existing lockfile or report a tooling error."

      - name: Run audit and generate SARIF
        id: audit
        if: always()
        run: |
          # Single uv audit run: SARIF output + exit-code-aware warnings.
          # exit 0 = no advisories; exit 1 = advisories found — both produce valid SARIF.
          # exit ≥2 = tooling failure (bad pyproject, network, missing lockfile) — not a finding.
          # This step never fails itself: the exit code goes to the gate step below so
          # SARIF is produced and uploaded before an advisory blocks the job.
          # uv.lock is committed (gptme/gptme#4278), so `uv sync --frozen` above installs
          # exactly what `uv audit` reads; there is no separate Poetry graph to match.
          audit_exit=0
          uv audit --preview-features audit-command \
              --output-format sarif \
              --ignore CVE-2025-69872 \
              > /tmp/audit_tmp.sarif || audit_exit=$?
          # Accepted ignores (no fix available):
          #   CVE-2025-69872 — diskcache pickle deserialization advisory (PYSEC-2026-2447);
          #   no upstream fix yet. Remove when diskcache ships a fixed version.
          # NOT ignored (flask/setuptools advisories currently inactive in dep tree):
          #   PYSEC-2026-2151, PYSEC-2026-3447 — unconditionally ignoring them
          #   would mask real advisories if these packages re-enter the dep tree.
          if [ "$audit_exit" -eq 0 ]; then
            echo "No known advisories found."
          elif [ "$audit_exit" -eq 1 ]; then
            echo "::error::Dependency advisories detected — see job log and the Security tab."
          else
            echo "::warning::Dependency audit tooling error (exit $audit_exit) — not an advisory finding; not blocking."
          fi
          echo "audit_exit=$audit_exit" >> "$GITHUB_OUTPUT"
          if [ "$audit_exit" -eq 0 ] || [ "$audit_exit" -eq 1 ]; then
            if [ -s /tmp/audit_tmp.sarif ]; then
              mv /tmp/audit_tmp.sarif audit.sarif
              echo "SARIF report generated ($(wc -c < audit.sarif) bytes)."
            else
              echo "::warning::SARIF generation produced empty output (non-blocking)."
            fi
          fi

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        # Fork PRs have a read-only GITHUB_TOKEN (no security-events: write),
        # so skip SARIF upload for fork PRs to avoid a silent failure.
        if: always() && hashFiles('audit.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        continue-on-error: true
        with:
          sarif_file: audit.sarif
          category: dependency-audit

      # Phase 2 gate: block on advisory findings only. Tooling errors (exit >= 2) never
      # fail the job. The weekly schedule has no merge to block, so it reports via the
      # ::error:: annotation and the Security tab without failing the run.
      - name: Fail on advisory findings
        if: always() && steps.audit.outputs.audit_exit == '1' && github.event_name != 'schedule'
        run: |
          echo "Dependency advisories found; see the audit step output and Security tab."
          exit 1
