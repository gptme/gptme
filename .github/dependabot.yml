# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

# Policy: every directory gets at most two PRs per run, one for minor/patch and
# one for majors, so bumps that share a lockfile never conflict with each other
# (four separate @wdio/* majors in /tauri/e2e kept rebasing each other and
# re-running the full Tauri matrix, gptme/gptme#4253). If one major in a
# group breaks, drop just that one with `@dependabot ignore <dep> major version`
# on the PR instead of closing the group.
#
# Python core and webui run weekly; the rest run monthly.

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Collapse routine minor/patch bumps into a single PR per run to keep the
    # review queue small. Major bumps still open individual PRs so breaking
    # changes get scrutiny.
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      python-majors:
        patterns:
          - "*"
        update-types:
          - "major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Action majors are routine (checkout v6 → v7 etc.) and CI exercises them
    # on the PR itself, so one PR covers every update type.
    groups:
      github-actions:
        patterns:
          - "*"
  # npm manifests live in several independent projects; each needs its own
  # entry. A dependency goes to the first group it matches, so the peer-coupled
  # groups must come before the catch-all majors group.
  - package-ecosystem: "npm"
    directory: "/webui"
    schedule:
      interval: "weekly"
    # @types/node should track the Node major we run on (20/22 in CI), not the
    # latest one (#4254, #4307 proposed 22 → 26).
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      webui-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Peer-coupled majors must move together: a lone `react` or
      # `@types/react` major fails `npm ci` on ERESOLVE (gptme/gptme#4118).
      # `react-day-picker` (8.x) and `vaul` (0.9.x) pin React peers below 19,
      # so they must ride along with the React major or the grouped update
      # still fails `npm ci`. The minor/patch group leaves both untouched
      # (8.10.1 won't move, 0.9.x won't cross to 1.x), so only this group can.
      react-majors:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "react-day-picker"
          - "vaul"
        update-types:
          - "major"
      # jest, its jsdom environment and ts-jest share a major; bumping only
      # jest-environment-jsdom pulls jsdom 26 under jest 29 (gptme/gptme#4259).
      jest-majors:
        patterns:
          - "jest"
          - "jest-environment-jsdom"
          - "ts-jest"
          - "@jest/*"
          - "@types/jest"
          - "jsdom"
        update-types:
          - "major"
      webui-majors:
        patterns:
          - "*"
        update-types:
          - "major"
  - package-ecosystem: "npm"
    directory: "/webui/extension"
    schedule:
      interval: "monthly"
    groups:
      webui-extension:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/tauri"
    schedule:
      interval: "monthly"
    groups:
      tauri-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      tauri-majors:
        patterns:
          - "*"
        update-types:
          - "major"
  - package-ecosystem: "npm"
    directory: "/tauri/e2e"
    schedule:
      interval: "monthly"
    groups:
      # Test harness only (WebdriverIO packages release in lockstep), so one
      # PR covers every update type.
      tauri-e2e:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/site/next"
    schedule:
      interval: "monthly"
    ignore:  # @types/node tracks our Node runtime major; see /webui above
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      site-next-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Peer-coupled majors must move together: a lone `react` or
      # `@types/react` major fails `npm ci` on ERESOLVE (gptme/gptme#4118).
      react-majors:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "major"
      site-next-majors:
        patterns:
          - "*"
        update-types:
          - "major"
  - package-ecosystem: "cargo"
    directory: "/tauri/src-tauri"
    schedule:
      interval: "monthly"
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      cargo-majors:
        patterns:
          - "*"
        update-types:
          - "major"
