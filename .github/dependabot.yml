# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Collapse routine minor/patch bumps into a single PR per run to keep the
    # review queue small. Major bumps still open individual PRs so breaking
    # changes get scrutiny.
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  # npm manifests live in several independent projects; each needs its own
  # entry. Routine minor/patch bumps are grouped per project to keep the review
  # queue small; major bumps still open individual PRs.
  - package-ecosystem: "npm"
    directory: "/webui"
    schedule:
      interval: "weekly"
    groups:
      webui-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Peer-coupled majors must move together: a lone `react` or
      # `@types/react` major fails `npm ci` on ERESOLVE (gptme/gptme#4118).
      # `react-day-picker` (8.x) and `vaul` (0.9.x) pin React peers below 19,
      # so they must ride along with the React major or the grouped update
      # still fails `npm ci`. The minor/patch group leaves both untouched
      # (8.10.1 won't move, 0.9.x won't cross to 1.x), so only this group can.
      react-majors:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "react-day-picker"
          - "vaul"
        update-types:
          - "major"
      # jest, its jsdom environment and ts-jest share a major; bumping only
      # jest-environment-jsdom pulls jsdom 26 under jest 29 (gptme/gptme#4259).
      jest-majors:
        patterns:
          - "jest"
          - "jest-environment-jsdom"
          - "ts-jest"
          - "@jest/*"
          - "@types/jest"
          - "jsdom"
        update-types:
          - "major"
  - package-ecosystem: "npm"
    directory: "/webui/extension"
    schedule:
      interval: "weekly"
    groups:
      webui-extension-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/tauri"
    schedule:
      interval: "weekly"
    groups:
      tauri-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/tauri/e2e"
    schedule:
      interval: "weekly"
    groups:
      tauri-e2e-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/site/next"
    schedule:
      interval: "weekly"
    groups:
      site-next-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Peer-coupled majors must move together: a lone `react` or
      # `@types/react` major fails `npm ci` on ERESOLVE (gptme/gptme#4118).
      react-majors:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "major"
  - package-ecosystem: "cargo"
    directory: "/tauri/src-tauri"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
