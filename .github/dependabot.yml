# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # lockfile-only: Dependabot runs a single `poetry lock` instead of
    # `poetry update <dep> --lock` per package. The per-package solve
    # re-evaluates the full 350+ package graph (torch, CUDA, ML extras)
    # each time; 3 deps × 2 retries ≈ 48 min and hits GitHub's ~45-min
    # Dependabot job limit, causing three consecutive cancellations
    # (2026-09-27, 2026-10-04, 2026-10-11). A single poetry lock run
    # resolves the whole graph once and stays within the timeout.
    versioning-strategy: lockfile-only
    # Collapse routine minor/patch bumps into a single PR per run to keep the
    # review queue small. Major bumps still open individual PRs so breaking
    # changes get scrutiny.
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  # npm manifests live in several independent projects; each needs its own
  # entry. Routine minor/patch bumps are grouped per project to keep the review
  # queue small; major bumps still open individual PRs.
  - package-ecosystem: "npm"
    directory: "/webui"
    schedule:
      interval: "weekly"
    groups:
      webui-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/webui/extension"
    schedule:
      interval: "weekly"
    groups:
      webui-extension-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/tauri"
    schedule:
      interval: "weekly"
    groups:
      tauri-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/tauri/e2e"
    schedule:
      interval: "weekly"
    groups:
      tauri-e2e-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/site/next"
    schedule:
      interval: "weekly"
    groups:
      site-next-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "cargo"
    directory: "/tauri/src-tauri"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
