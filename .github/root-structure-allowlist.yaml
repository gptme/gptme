---
# Allowed top-level entries in the gptme repository.
# Update this list deliberately when adding a new root file or directory.
# Consumed by the validate-root-structure pre-commit hook (see .pre-commit-config.yaml).

allowed_entries:
  # Files and configuration
  - .dockerignore
  - .env.example
  - .github
  - .gitignore
  - .pre-commit-config.yaml
  - AGENTS.md
  - CITATION.cff
  - DOMAIN.md
  - LICENSE
  - Makefile
  - README.md
  - SECURITY.md
  - docker-compose.yml
  - gptme.toml
  - mypy.ini
  - poetry.lock
  - pyproject.toml

  # Directories
  - docs
  - gptme
  - media
  - packages
  - scripts
  - site
  - tauri
  - tests
  - webui
