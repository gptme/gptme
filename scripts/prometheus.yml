global:
  scrape_interval: 15s
scrape_configs:
  - job_name: 'gptme'
    static_configs:
      # gptme-server on its default port; it must listen beyond 127.0.0.1
      # (e.g. `gptme-server --host 0.0.0.0`) for the container to reach it.
      - targets: ['172.17.0.1:5700']  # Linux-compatible alternative to host.docker.internal
    metrics_path: '/api/v0/metrics'
    scrape_interval: 5s
