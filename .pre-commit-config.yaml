repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.2
  hooks:
  - id: ruff
    args: [ --fix ]
  - id: ruff-format
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.12.0
  hooks:
  - id: mypy
    additional_dependencies: [types-tabulate, types-docutils, tomli, tomli_w, opentelemetry-api, opentelemetry-sdk, prometheus-client, prompt_toolkit, click, pytest, openai==1.101.0, rich, tomlkit, dspy, textual]
    args: [--ignore-missing-imports, --check-untyped-defs]
- repo: https://github.com/gptme/gptme-contrib
  rev: 74c946c792c87eccd8632dbf26cbc390dd5c26bd  # post-#1479: shareable hook + git-ls-files impl
  hooks:
  - id: check-root-structure
    args:
      # Files
      - --allow=.dockerignore
      - --allow=.env.example
      - --allow=.github
      - --allow=.gitignore
      - --allow=.pre-commit-config.yaml
      - --allow=AGENTS.md
      - --allow=LICENSE
      - --allow=Makefile
      - --allow=README.md
      - --allow=SECURITY.md
      - --allow=docker-compose.yml
      - --allow=gptme.toml
      - --allow=mypy.ini
      - --allow=poetry.lock
      - --allow=pyproject.toml
      # Directories
      - --allow=docs
      - --allow=gptme
      - --allow=gptme-extension
      - --allow=media
      - --allow=packages
      - --allow=scripts
      - --allow=site
      - --allow=tauri
      - --allow=tests
      - --allow=webui
- repo: local
  hooks:
  - id: check-rst-formatting
    name: Check RST nested list formatting
    description: Ensures RST files have proper blank lines between parent/child list items
    entry: python3 scripts/check_rst_formatting.py
    language: system
    files: \.rst$
    exclude: docs/_build/
    args: [docs/]
  - id: check-poetry-lock-sync
    name: Check poetry.lock is in sync
    description: Ensures poetry.lock is in sync with pyproject.toml
    entry: bash scripts/check_poetry_lock_sync.sh
    language: system
    files: ^(pyproject\.toml|poetry\.lock)$
    pass_filenames: false
